name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kronwerke-launcher
          path: build/kronwerke-launcher.jar
