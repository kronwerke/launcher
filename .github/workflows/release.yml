# A release is what a server downloads as its jar, and what `!mc launcher-update` installs.
# Start one by pushing a tag v*, or from the Actions tab with a version. It is published
# only after the jar and SHA256SUMS are attached.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like v0.2.0. The tag is made from the chosen branch."
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: version
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a version: $VERSION" >&2; exit 1; }
          grep -q "^## ${VERSION#v}\$" CHANGELOG.md || { echo "CHANGELOG.md has no section ## ${VERSION#v}" >&2; exit 1; }

      - name: build
        run: |
          sh build.sh "${VERSION#v}"
          test "$(java -jar build/launcher.jar version)" = "${VERSION#v}"
          mkdir dist && cp build/launcher.jar dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: notes
        run: awk -v h="## ${VERSION#v}" '$0 == h { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md

      - name: publish
        run: gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
